<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Agrônomo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: block; background-color: #f4f7f4; font-family: sans-serif; height: auto; width: auto; padding: 0; margin: 0;">
    <header style="background-color: #1b5e20; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
        <h2 id="boas-vindas" style="margin: 0; font-size: 1.4rem;">Painel do Agrônomo</h2>
        <button id="logout" style="background-color: #d32f2f; color: white; border: none; padding: 8px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background-color 0.2s;">Sair</button>
    </header>

    <main style="max-width: 1200px; margin: 30px auto; padding: 0 20px; width: auto; height: auto; background-color: transparent; display: block;">
        <section class="lista-recortes-agronomo">
            <h3 style="color: #1b5e20; border-bottom: 2px solid #a5d6a7; padding-bottom: 8px; margin-top: 0; margin-bottom: 20px; font-size: 1.3rem;">Solicitações e Recortes Recebidos</h3>
            <p><small style="color: #666;">Clique em "Analisar Área" para abrir o Dashboard completo com os gráficos e o mapa de calor da fazenda selecionada.</small></p>
            
            <!-- Injeção dos estilos de Grid diretamente na Div Pai da lista -->
            <div id="container-recortes-recebidos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; width: 100%;"></div>
        </section>
    </main>

    <!-- Injeta as regras de estilo para os cards dinâmicos que o JavaScript cria sozinhos -->
    <style>
        #container-recortes-recebidos > div {
            background-color: white !important;
            border: 0.1rem solid black !important;
            border-radius: 6px !important;
            padding: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05) !important;
        }
        #container-recortes-recebidos h4 {
            margin: 0 0 10px 0 !important;
            font-size: 1.15rem !important;
            border-bottom: 1px solid #eee !important;
            padding-bottom: 5px !important;
        }
        #container-recortes-recebidos p {
            margin: 6px 0 !important;
            font-size: 0.9rem !important;
            color: #444 !important;
        }
        #container-recortes-recebidos button {
            background-color: #2e7d32 !important;
            color: white !important;
            border: none !important;
            padding: 10px !important;
            width: 100% !important;
            margin-top: 15px !important;
            font-weight: bold !important;
            border-radius: 4px !important;
            cursor: pointer !important;
        }
        #container-recortes-recebidos button:hover {
            background-color: #1b5e20 !important;
        }
    </style>

    <script src="painel-agronomo.js"></script>
</body>
</html>
