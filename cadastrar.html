<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="" id="cadastro" class="form">
        <h2>Criar Conta</h2>
        
        <label for="tipo-usuario">Você é:</label>
        <select id="tipo-usuario">
            <option value="agricultor">Agricultor</option>
            <option value="agronomo">Agrônomo</option>
        </select>

        <input type="text" placeholder="Nome: " id="nome-cadastro" required>
        <input type="text" id="cpf" placeholder="CPF: " required>
        <input type="tel" id="telefone" placeholder="Telefone: " required>
        <input type="password" id="senha-cadastro" placeholder="Criar senha: " required>
        
        <input type="submit" value="Criar" id="criar">
        <button type="button" id="voltar">Voltar</button>
    </form>
    
    <script src="cadastrar.js"></script>
</body>
</html>
